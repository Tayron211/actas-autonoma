<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="uaBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#FF5D00" />
    </linearGradient>
    <filter id="badgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6600" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Pastilla naranja redondeada idéntica a la imagen de referencia -->
  <rect x="5" y="6" width="230" height="58" rx="16" ry="16" fill="url(#uaBadgeGrad)" filter="url(#badgeGlow)" />
  
  <!-- Texto en blanco negrita con tilde en la O -->
  <text x="120" y="44" 
        font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" 
        font-size="25" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="1.8">A AUTÓNOMA</text>
</svg>
